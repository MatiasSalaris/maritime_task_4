# Dev compose: source is volume-mounted → hot reload on every file save.
# Backend: uvicorn --reload watches Python files
# Frontend: Vite HMR watches JS/Svelte files

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.dev
    volumes:
      - ./backend:/app          # mount source for hot reload
    ports:
      - "8000:8000"
    environment:
      - PROVIDER=sim
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - BACKEND_URL=http://backend:8000   # Vite proxy target
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  frontend_node_modules:
