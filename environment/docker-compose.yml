services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - PROVIDER=sim          # change to "hardware" when integrating real platforms
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # AI control layer (the "brains"): a separate container that connects to the
  # world model over its WebSocket/REST contract and drives the agents with
  # real LLM-selected tools. Waits for the backend to be healthy before starting.
  ai:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ../maritime_swarm:/app/maritime_swarm:ro
    environment:
      - WORLD_HTTP_URL=http://backend:8000
      - WORLD_WS_URL=ws://backend:8000
      - PYTHONUNBUFFERED=1
    # GROQ_API_KEY (and optional GROQ_MODEL / MISSION) come from the repo-root
    # .env if present; without a key the offline heuristic planner is used.
    env_file:
      - path: ../.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "pip install --no-cache-dir requests websockets && python -m maritime_swarm.ai_control"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
